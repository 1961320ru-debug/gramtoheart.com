<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050403">

<title>Gram to Heart™</title>

<meta name="description"
      content="A new growth mechanism for brands. A simple way to support pets in need.">

<link rel="preload" as="image" href="./slide.jpg">

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #050403;
    color: white;
  }

  body {
    font-family: Arial, sans-serif;
  }

  .stage {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #050403;
  }

  .scene {
    position: relative;
    width: max-content;
    max-width: 100vw;
    margin: 0;
    overflow: hidden;
    isolation: isolate;
    background: #050403;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .scene:focus-visible {
    outline: 2px solid #ffb94f;
    outline-offset: -3px;
  }

  .photo {
    display: block;
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100svh;
    opacity: 1;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  .fx {
    display: none;
    position: absolute;
    pointer-events: none;
    z-index: 2;
  }

  .enhanced .fx {
    display: block;
  }

  /* Объёмное освещение после сборки. */

  .atmosphere {
    inset: 0;
    opacity: 0;
    background:
      radial-gradient(
        ellipse at 84% 24%,
        rgba(255, 171, 66, 0.42),
        rgba(255, 124, 25, 0.12) 35%,
        transparent 66%
      );
    mix-blend-mode: screen;
  }

  .settled .atmosphere {
    animation: atmosphere 9s ease-in-out infinite;
  }

  @keyframes atmosphere {
    0%, 100% {
      opacity: 0.18;
      transform: translate3d(3%, -2%, 0);
    }

    50% {
      opacity: 0.82;
      transform: translate3d(-5%, 3%, 0);
    }
  }

  /* Широкий диагональный световой проход. */

  .sweep {
    top: -40%;
    left: -65%;
    width: 45%;
    height: 180%;
    opacity: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 181, 81, 0.035) 18%,
      rgba(255, 205, 144, 0.20) 42%,
      rgba(255, 232, 197, 0.36) 50%,
      rgba(255, 191, 99, 0.12) 64%,
      transparent 100%
    );
    mix-blend-mode: screen;
    transform: rotate(-22deg);
  }

  .settled .sweep {
    animation: sweep 8s cubic-bezier(.22,.61,.36,1) infinite;
  }

  @keyframes sweep {
    0% {
      opacity: 0;
      transform: translate3d(0,0,0) rotate(-22deg);
    }

    10% {
      opacity: 0.85;
    }

    48% {
      opacity: 0.85;
    }

    68%, 100% {
      opacity: 0;
      transform: translate3d(440%,0,0) rotate(-22deg);
    }
  }

  /* Световой ореол во время первой сборки. */

  .birth {
    left: 50%;
    top: 48%;
    width: 50%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      rgba(255, 187, 98, 0.17),
      rgba(255, 158, 46, 0.055) 36%,
      transparent 69%
    );
    mix-blend-mode: screen;
    opacity: 0;
  }

  .enhanced .birth {
    animation: birth 4.6s ease-out both;
  }

  @keyframes birth {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.2);
    }

    35% {
      opacity: 1;
    }

    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(2.8);
    }
  }

  /* Ссылка располагается поверх email на исходном слайде. */

  .contact {
    position: absolute;
    z-index: 6;
    left: 42%;
    top: 96.7%;
    width: 16%;
    height: 3.3%;
    border-radius: 3px;
  }

  .contact:focus-visible {
    outline: 2px solid #ffbc60;
    outline-offset: 3px;
  }

  /* Кнопка остановки эффектов. */

  .pause {
    position: fixed;
    z-index: 10;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 50%;
    background: rgba(8,6,4,0.72);
    color: #ffe0b1;
    font: 15px Arial, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
  }

  .pause:hover {
    border-color: #ffbc60;
    background: rgba(45,29,12,0.9);
  }

  .pause:focus-visible {
    outline: 2px solid #ffbc60;
    outline-offset: 4px;
  }

  .paused .fx {
    animation-play-state: paused !important;
  }

  @media (prefers-reduced-motion: reduce) {
    .fx,
    canvas,
    .pause {
      display: none !important;
    }

    .photo {
      opacity: 1 !important;
    }
  }
</style>
</head>

<body>

<main class="stage">
  <div
    class="scene"
    tabindex="0"
    aria-label="Gram to Heart. Press Enter or tap the image to replay the animation."
  >
    <img
      class="photo"
      src="./slide.jpg"
      alt="Gram to Heart™. One is waiting. One is loved. A new growth mechanism for brands. A simple way to support pets in need."
      fetchpriority="high"
      decoding="async"
    >

    <div class="fx birth" aria-hidden="true"></div>
    <div class="fx atmosphere" aria-hidden="true"></div>
    <div class="fx sweep" aria-hidden="true"></div>

    <canvas aria-hidden="true"></canvas>

    <a
      class="contact"
      href="mailto:info@gramtoheart.com"
      aria-label="Email info@gramtoheart.com"
    ></a>
  </div>
</main>

<button
  class="pause"
  type="button"
  aria-label="Pause animation"
>Ⅱ</button>

<script>
(() => {
  'use strict';

  const scene = document.querySelector('.scene');
  const photo = document.querySelector('.photo');
  const canvas = document.querySelector('canvas');
  const toggle = document.querySelector('.pause');
  const ctx = canvas.getContext('2d');

  const reduce = matchMedia(
    '(prefers-reduced-motion: reduce)'
  );

  if (!ctx || reduce.matches) return;

  let dots = [];
  let dust = [];

  let width = 1;
  let height = 1;

  let elapsed = 0;
  let previous = null;
  let frame = 0;

  let paused = false;
  let ready = false;

  const duration = 4600;

  let seed = 17;

  const random = () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };

  function resize() {
    const rect = scene.getBoundingClientRect();

    width = rect.width;
    height = rect.height;

    const dpr = Math.min(devicePixelRatio || 1, 2);

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function build() {
    const sample = document.createElement('canvas');

    sample.width = 112;

    sample.height = Math.round(
      112 * photo.naturalHeight / photo.naturalWidth
    );

    const brush = sample.getContext('2d');

    brush.drawImage(
      photo,
      0,
      0,
      sample.width,
      sample.height
    );

    const pixels = brush.getImageData(
      0,
      0,
      sample.width,
      sample.height
    ).data;

    for (let y = 0; y < sample.height; y++) {
      for (let x = 0; x < sample.width; x++) {
        const i = (y * sample.width + x) * 4;

        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];

        if (r + g + b < 42) continue;

        const angle = random() * Math.PI * 2;
        const radius = 0.3 + random() * 0.9;

        dots.push({
          x: (x + 0.5) / sample.width,
          y: (y + 0.5) / sample.height,

          dx: Math.cos(angle) * radius,
          dy: Math.sin(angle) * radius,

          delay: random() * 0.3,
          size: 1 / sample.width,

          color: `rgb(${r},${g},${b})`
        });
      }
    }

    dust = Array.from({ length: 36 }, () => ({
      x: random(),
      y: random(),
      speed: 0.008 + random() * 0.018,
      size: 0.6 + random() * 1.2,
      phase: random() * 6.28
    }));
  }

  function draw(time) {
    frame = 0;

    if (
      paused ||
      document.hidden ||
      reduce.matches
    ) return;

    if (previous !== null) {
      elapsed += Math.min(time - previous, 64);
    }

    previous = time;

    ctx.clearRect(0, 0, width, height);

    if (elapsed < duration) {
      const progress = Math.min(
        1,
        elapsed / 3400
      );

      ctx.globalAlpha =
        Math.min(1, elapsed / 400) *
        (
          1 -
          Math.max(0, (elapsed - 3650) / 950)
        );

      for (const p of dots) {
        const local = Math.max(
          0,
          Math.min(
            1,
            (progress - p.delay) / (1 - p.delay)
          )
        );

        const remaining = Math.pow(
          1 - local,
          4
        );

        const twist = remaining * 2.4;

        const dx =
          p.dx * Math.cos(twist) -
          p.dy * Math.sin(twist);

        const dy =
          p.dx * Math.sin(twist) +
          p.dy * Math.cos(twist);

        const x =
          (p.x + dx * remaining) * width;

        const y =
          (p.y + dy * remaining) * height;

        const size = Math.max(
          1,
          p.size * width *
          (1 - remaining * 0.78)
        );

        ctx.fillStyle = p.color;

        ctx.fillRect(
          x - size / 2,
          y - size / 2,
          size + 0.3,
          size + 0.3
        );
      }

      photo.style.opacity = Math.max(
        0,
        Math.min(
          1,
          (elapsed - 3250) / 1150
        )
      );
    } else {
      photo.style.opacity = 1;
      scene.classList.add('settled');
    }

    ctx.globalAlpha = 1;

    const t = elapsed / 1000;

    if (elapsed > 3000) {
      for (const p of dust) {
        const x =
          (
            p.x +
            Math.sin(t * 0.25 + p.phase) * 0.018
          ) * width;

        const y =
          (
            1 -
            ((p.y + t * p.speed) % 1)
          ) * height;

        const opacity =
          0.15 +
          0.4 *
          (
            0.5 +
            0.5 * Math.sin(t + p.phase)
          );

        ctx.fillStyle =
          `rgba(255,191,102,${opacity})`;

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          p.size,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }
    }

    frame = requestAnimationFrame(draw);
  }

  function replay() {
    if (!ready || reduce.matches) return;

    cancelAnimationFrame(frame);

    elapsed = 0;
    previous = null;
    paused = false;

    scene.classList.remove('settled');
    scene.classList.add('enhanced');

    document.body.classList.remove('paused');

    toggle.textContent = 'Ⅱ';

    toggle.setAttribute(
      'aria-label',
      'Pause animation'
    );

    photo.style.opacity = 0;

    frame = requestAnimationFrame(draw);
  }

  function init() {
    if (ready || !photo.naturalWidth) return;

    try {
      resize();
      build();

      ready = true;

      replay();
    } catch (error) {
      scene.classList.remove('enhanced');

      photo.style.opacity = 1;
      canvas.hidden = true;
    }
  }

  photo.addEventListener(
    'load',
    init,
    { once: true }
  );

  if (photo.complete) init();

  scene.addEventListener('click', event => {
    if (!event.target.closest('a')) {
      replay();
    }
  });

  scene.addEventListener('keydown', event => {
    if (
      event.target === scene &&
      (
        event.key === 'Enter' ||
        event.key === ' '
      )
    ) {
      event.preventDefault();
      replay();
    }
  });

  toggle.addEventListener('click', () => {
    paused = !paused;

    document.body.classList.toggle(
      'paused',
      paused
    );

    toggle.textContent = paused ? '▶' : 'Ⅱ';

    toggle.setAttribute(
      'aria-label',
      paused
        ? 'Resume animation'
        : 'Pause animation'
    );

    cancelAnimationFrame(frame);
    previous = null;

    if (!paused) {
      frame = requestAnimationFrame(draw);
    }
  });

  addEventListener('resize', resize);

  document.addEventListener(
    'visibilitychange',
    () => {
      cancelAnimationFrame(frame);
      previous = null;

      document.body.classList.toggle(
        'paused',
        paused || document.hidden
      );

      if (!document.hidden && !paused) {
        frame = requestAnimationFrame(draw);
      }
    }
  );

  reduce.addEventListener('change', () => {
    if (reduce.matches) {
      cancelAnimationFrame(frame);

      scene.classList.remove(
        'enhanced',
        'settled'
      );

      photo.style.opacity = 1;

      ctx.clearRect(
        0,
        0,
        width,
        height
      );
    } else if (ready) {
      replay();
    }
  });
})();
</script>

</body>
</html>
