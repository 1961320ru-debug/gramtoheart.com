<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">

<title>Gram to Heart™</title>

<meta
  name="description"
  content="A new growth mechanism for brands. A simple way to support pets in need."
>

<link rel="preload" as="image" href="./slide.jpg">

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #000;
  }

  .stage {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }

  .scene {
    position: relative;
    width: max-content;
    max-width: 100vw;
    margin: 0;
    isolation: isolate;
    background: #000;
  }

  .photo {
    display: block;
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100svh;
  }

  /*
    До загрузки фотографии — чёрный экран.
    Без JavaScript изображение показывается обычно.
  */

  .js .photo {
    opacity: 0;
  }

  /*
    Две копии исходной фотографии.
    Мягкие маски оставляют видимыми только глаза.
    Размер и положение копий совпадают с оригиналом.
  */

  .eye {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;

    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;

    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }

  .eye-left {
    -webkit-mask-image: radial-gradient(
      ellipse 2.2% 2.3% at 38.5% 46.7%,
      #000 0%,
      #000 34%,
      rgba(0,0,0,0.85) 53%,
      rgba(0,0,0,0.25) 77%,
      transparent 100%
    );

    mask-image: radial-gradient(
      ellipse 2.2% 2.3% at 38.5% 46.7%,
      #000 0%,
      #000 34%,
      rgba(0,0,0,0.85) 53%,
      rgba(0,0,0,0.25) 77%,
      transparent 100%
    );
  }

  .eye-right {
    -webkit-mask-image: radial-gradient(
      ellipse 2.2% 2.3% at 60.5% 46.7%,
      #000 0%,
      #000 34%,
      rgba(0,0,0,0.85) 53%,
      rgba(0,0,0,0.25) 77%,
      transparent 100%
    );

    mask-image: radial-gradient(
      ellipse 2.2% 2.3% at 60.5% 46.7%,
      #000 0%,
      #000 34%,
      rgba(0,0,0,0.85) 53%,
      rgba(0,0,0,0.25) 77%,
      transparent 100%
    );
  }

  .playing .eye {
    display: block;
    animation: eyes-appear 7s linear both;
  }

  .playing .photo {
    animation:
      photo-appear 5s 2s
      cubic-bezier(.4, 0, .6, 1) both;
  }

  /*
    Глаза появляются первыми.
    Когда фотография становится видимой,
    копии глаз постепенно исчезают.
  */

  @keyframes eyes-appear {
    0% {
      opacity: 0;
    }

    8% {
      opacity: 0.08;
    }

    22% {
      opacity: 0.8;
    }

    29%, 43% {
      opacity: 1;
    }

    65% {
      opacity: 0.8;
    }

    85% {
      opacity: 0.3;
    }

    100% {
      opacity: 0;
    }
  }

  @keyframes photo-appear {
    from {
      opacity: 0;
    }

    to {
      opacity: 1;
    }
  }

  .finished .photo {
    opacity: 1;
  }

  .finished .eye {
    display: none;
  }

  .contact {
    position: absolute;
    z-index: 5;
    left: 42%;
    top: 96.7%;
    width: 16%;
    height: 3.3%;
    border-radius: 3px;
  }

  .contact:focus-visible {
    outline: 2px solid #ffbc64;
    outline-offset: 3px;
  }

  .replay {
    position: fixed;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 10;

    display: none;
    place-items: center;

    width: 42px;
    height: 42px;
    padding: 0;

    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;

    background: rgba(0,0,0,0.75);
    color: #dfc5a0;

    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .can-replay .replay {
    display: grid;
  }

  .replay:hover {
    border-color: #dfc5a0;
  }

  .replay:focus-visible {
    outline: 2px solid #ffbc64;
    outline-offset: 4px;
  }

  .replay svg {
    width: 19px;
    height: 19px;
  }

  @media (prefers-reduced-motion: reduce) {
    .js .photo,
    .playing .photo {
      opacity: 1;
      animation: none;
    }

    .eye,
    .replay {
      display: none !important;
      animation: none !important;
    }
  }
</style>

<script>
  document.documentElement.classList.add('js');
</script>
</head>

<body>

<main class="stage">
  <div class="scene">

    <img
      class="photo"
      src="./slide.jpg"
      alt="Gram to Heart™. One is waiting. One is loved. A new growth mechanism for brands. A simple way to support pets in need."
      fetchpriority="high"
      decoding="async"
    >

    <img
      class="eye eye-left"
      src="./slide.jpg"
      alt=""
      aria-hidden="true"
    >

    <img
      class="eye eye-right"
      src="./slide.jpg"
      alt=""
      aria-hidden="true"
    >

    <a
      class="contact"
      href="mailto:info@gramtoheart.com"
      aria-label="Email info@gramtoheart.com"
    ></a>

  </div>
</main>

<button
  class="replay"
  type="button"
  aria-label="Replay introduction"
  title="Replay introduction"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M3 10a9 9 0 1 1 2.6 8.4"/>
    <path d="M3 4v6h6"/>
  </svg>
</button>

<script>
(() => {
  'use strict';

  const scene = document.querySelector('.scene');
  const photo = document.querySelector('.photo');
  const eyes = [...document.querySelectorAll('.eye')];
  const replay = document.querySelector('.replay');

  const motion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  );

  let ready = false;
  let preparing = false;

  function showOriginal() {
    scene.classList.remove('playing');
    scene.classList.add('finished');
    document.body.classList.remove('can-replay');
  }

  function play() {
    if (!ready) return;

    if (motion.matches) {
      showOriginal();
      return;
    }

    document.body.classList.remove('can-replay');

    scene.classList.remove('playing', 'finished');

    void scene.offsetWidth;

    scene.classList.add('playing');
  }

  async function start() {
    if (
      preparing ||
      ready ||
      !photo.naturalWidth
    ) return;

    preparing = true;

    try {
      await Promise.all(
        [photo, ...eyes].map(image => {
          if (typeof image.decode === 'function') {
            return image.decode();
          }

          if (image.complete && image.naturalWidth) {
            return Promise.resolve();
          }

          return new Promise((resolve, reject) => {
            image.addEventListener(
              'load',
              resolve,
              { once: true }
            );

            image.addEventListener(
              'error',
              reject,
              { once: true }
            );
          });
        })
      );

      ready = true;
      play();
    } catch (error) {
      showOriginal();
    }
  }

  photo.addEventListener('animationend', event => {
    if (event.animationName !== 'photo-appear') return;

    scene.classList.remove('playing');
    scene.classList.add('finished');

    if (!motion.matches) {
      document.body.classList.add('can-replay');
    }
  });

  photo.addEventListener(
    'load',
    start,
    { once: true }
  );

  photo.addEventListener(
    'error',
    () => {
      document.documentElement.classList.remove('js');
      showOriginal();
    },
    { once: true }
  );

  if (photo.complete) {
    if (photo.naturalWidth) {
      start();
    } else {
      document.documentElement.classList.remove('js');
    }
  }

  replay.addEventListener('click', play);

  motion.addEventListener('change', () => {
    if (motion.matches) {
      showOriginal();
    } else if (ready) {
      document.body.classList.add('can-replay');
    }
  });
})();
</script>

</body>
</html>
