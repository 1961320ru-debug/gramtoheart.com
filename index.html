<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">

<title>Gram to Heart™ — Two Worlds</title>

<meta
  name="description"
  content="A new growth mechanism for brands. A simple way to support pets in need."
>

<link rel="preload" as="image" href="./slide.jpg">

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: #fff;
  }

  body {
    font-family: Arial, sans-serif;
  }

  .stage {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }

  .scene {
    position: relative;
    width: max-content;
    max-width: 100vw;
    margin: 0;
    overflow: hidden;
    isolation: isolate;
    background: #000;
  }

  .photo {
    display: block;
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100svh;
  }

  /*
    Исходная фотография неподвижна.
    Анимируются только маски поверх неё.
  */

  .effect {
    position: absolute;
    pointer-events: none;
    visibility: hidden;
  }

  .playing .effect {
    visibility: visible;
  }

  /* Дополнительная темнота на стороне приюта. */

  .shelter-shadow {
    z-index: 2;
    inset: 0 50% 0 0;
    background: #000;
    opacity: 0;
  }

  .playing .shelter-shadow {
    animation: shelter-shadow 3.8s linear both;
  }

  @keyframes shelter-shadow {
    0%, 24% {
      opacity: 0.35;
    }

    65% {
      opacity: 0.18;
    }

    100% {
      opacity: 0;
    }
  }

  /*
    Сторона дома сначала приглушена.
    Свет возвращается с задержкой.
  */

  .home-shadow {
    z-index: 2;
    inset: 0 0 0 50%;
    background: #000;
    opacity: 0;
  }

  .playing .home-shadow {
    animation: home-shadow 4.2s ease both;
  }

  @keyframes home-shadow {
    0%, 38% {
      opacity: 0.68;
    }

    75% {
      opacity: 0.20;
    }

    100% {
      opacity: 0;
    }
  }

  /*
    Окно на уровне глаз:
    между 45.5% и 49.5% высоты фотографии.
  */

  .mask {
    z-index: 4;
    background: #000;
  }

  .top-left,
  .top-right {
    top: 0;
    width: 50%;
    height: 45.5%;
    transform-origin: center top;
  }

  .bottom-left,
  .bottom-right {
    top: 49.5%;
    width: 50%;
    height: 27%;
    transform-origin: center bottom;
  }

  .top-left,
  .bottom-left {
    left: 0;
  }

  .top-right,
  .bottom-right {
    right: 0;
  }

  /* Сначала раскрывается приют. */

  .playing .top-left,
  .playing .bottom-left {
    animation:
      open-mask 1.9s 0.9s
      cubic-bezier(.65, 0, .2, 1) both;
  }

  /* Дом открывается позже. */

  .playing .top-right,
  .playing .bottom-right {
    animation:
      open-mask 2.1s 1.55s
      cubic-bezier(.65, 0, .2, 1) both;
  }

  @keyframes open-mask {
    from {
      transform: scaleY(1);
    }

    to {
      transform: scaleY(0);
    }
  }

  /* Нижние надписи открываются после фотографии. */

  .lower-mask {
    z-index: 5;
    left: 0;
    right: 0;
    top: 76.5%;
    bottom: 0;
    background: #000;
    transform-origin: center bottom;
  }

  .playing .lower-mask {
    animation:
      open-mask 1.5s 2.65s
      cubic-bezier(.65, 0, .2, 1) both;
  }

  /* Логотип — последний акцент. */

  .logo-mask {
    z-index: 6;
    left: 34%;
    right: 33%;
    top: 92%;
    bottom: 0;
    background: #000;
  }

  .playing .logo-mask {
    animation: disappear 1.1s 3.9s ease both;
  }

  /* Начальная темнота плавно открывает глаза. */

  .opening-black {
    z-index: 8;
    inset: 0;
    background: #000;
  }

  .playing .opening-black {
    animation: disappear 1s ease both;
  }

  @keyframes disappear {
    from {
      opacity: 1;
    }

    to {
      opacity: 0;
    }
  }

  /*
    Один мягкий проход света по стороне дома.
    Нет бесконечного свечения или повторения.
  */

  .home-light {
    z-index: 3;
    top: 0;
    right: 0;
    width: 50%;
    height: 76.5%;
    overflow: hidden;
    opacity: 0;
    mix-blend-mode: screen;
  }

  .home-light::before {
    content: "";
    position: absolute;
    top: -35%;
    left: -100%;
    width: 110%;
    height: 180%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 179, 88, 0.08) 28%,
      rgba(255, 221, 173, 0.30) 50%,
      rgba(255, 174, 74, 0.08) 72%,
      transparent
    );
    transform: rotate(-18deg);
  }

  .playing .home-light {
    animation: light-opacity 2s 2.4s ease both;
  }

  .playing .home-light::before {
    animation:
      light-travel 2s 2.4s
      cubic-bezier(.22, .61, .36, 1) both;
  }

  @keyframes light-opacity {
    0%, 100% {
      opacity: 0;
    }

    35%, 65% {
      opacity: 0.85;
    }
  }

  @keyframes light-travel {
    from {
      transform: translateX(0) rotate(-18deg);
    }

    to {
      transform: translateX(220%) rotate(-18deg);
    }
  }

  /* Email остаётся на месте исходной надписи. */

  .contact {
    position: absolute;
    z-index: 10;
    left: 42%;
    top: 96.7%;
    width: 16%;
    height: 3.3%;
    border-radius: 3px;
  }

  .contact:focus-visible {
    outline: 2px solid #ffbd68;
    outline-offset: 3px;
  }

  /* Повтор вступления — отдельной небольшой кнопкой. */

  .replay {
    position: fixed;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 20;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 50%;
    color: #e9cfa9;
    background: rgba(0,0,0,0.72);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition:
      background 200ms ease,
      border-color 200ms ease;
  }

  .replay:hover {
    background: #24190c;
    border-color: #e9b56e;
  }

  .replay:focus-visible {
    outline: 2px solid #ffbd68;
    outline-offset: 4px;
  }

  .replay svg {
    width: 19px;
    height: 19px;
  }

  @media (prefers-reduced-motion: reduce) {
    .effect,
    .replay {
      display: none !important;
      animation: none !important;
    }
  }
</style>
</head>

<body>

<main class="stage">
  <div class="scene">

    <img
      class="photo"
      src="./slide.jpg"
      alt="Gram to Heart™. One is waiting. One is loved. A new growth mechanism for brands. A simple way to support pets in need."
      fetchpriority="high"
      decoding="async"
    >

    <div
      class="effect shelter-shadow"
      aria-hidden="true"
    ></div>

    <div
      class="effect home-shadow"
      aria-hidden="true"
    ></div>

    <div
      class="effect home-light"
      aria-hidden="true"
    ></div>

    <div
      class="effect mask top-left"
      aria-hidden="true"
    ></div>

    <div
      class="effect mask bottom-left"
      aria-hidden="true"
    ></div>

    <div
      class="effect mask top-right"
      aria-hidden="true"
    ></div>

    <div
      class="effect mask bottom-right"
      aria-hidden="true"
    ></div>

    <div
      class="effect lower-mask"
      aria-hidden="true"
    ></div>

    <div
      class="effect logo-mask"
      aria-hidden="true"
    ></div>

    <div
      class="effect opening-black"
      aria-hidden="true"
    ></div>

    <a
      class="contact"
      href="mailto:info@gramtoheart.com"
      aria-label="Email info@gramtoheart.com"
    ></a>

  </div>
</main>

<button
  class="replay"
  type="button"
  aria-label="Replay introduction"
  title="Replay introduction"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M3 10a9 9 0 1 1 2.6 8.4"/>
    <path d="M3 4v6h6"/>
  </svg>
</button>

<script>
(() => {
  'use strict';

  const scene = document.querySelector('.scene');
  const photo = document.querySelector('.photo');
  const replay = document.querySelector('.replay');

  const motion = matchMedia(
    '(prefers-reduced-motion: reduce)'
  );

  let ready = false;

  function play() {
    if (!ready || motion.matches) return;

    scene.classList.remove('playing');

    /*
      Сбрасываем CSS-анимации,
      чтобы кнопка повторяла вступление.
    */
    void scene.offsetWidth;

    scene.classList.add('playing');
  }

  function start() {
    if (ready || !photo.naturalWidth) return;

    ready = true;
    play();
  }

  photo.addEventListener(
    'load',
    start,
    { once: true }
  );

  if (photo.complete) {
    start();
  }

  replay.addEventListener('click', play);

  motion.addEventListener('change', () => {
    if (motion.matches) {
      scene.classList.remove('playing');
    }
  });
})();
</script>

</body>
</html>
