<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050403">

  <title>Gram to Heart™</title>
  <meta
    name="description"
    content="A new growth mechanism for brands. A simple way to support pets in need."
  >

  <link rel="preload" as="image" href="./slide.jpg">

  <style>
    :root {
      color-scheme: dark;
      background: #050403;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #050403;
      font-family: Arial, sans-serif;
    }

    .stage {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 0;
    }

    .artwork {
      position: relative;
      margin: 0;
      max-width: 100%;
      isolation: isolate;
      overflow: hidden;
      background: #050403;
    }

    .slide {
      display: block;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100svh;
    }

    .effect {
      position: absolute;
      pointer-events: none;
      opacity: 0;
    }

    /* Большой мягкий свет, без видимых границ. */
    .ambient {
      inset: 0;
      background:
        radial-gradient(
          ellipse at 85% 30%,
          rgba(255, 174, 80, 0.16),
          rgba(255, 153, 45, 0.04) 35%,
          transparent 68%
        );
      mix-blend-mode: screen;
    }

    /* Свет следует за курсором, фотография остаётся неподвижной. */
    .pointer-light {
      inset: 0;
      background:
        radial-gradient(
          ellipse 45% 60% at var(--px, 72%) var(--py, 40%),
          rgba(255, 192, 109, 0.13),
          rgba(255, 169, 65, 0.025) 48%,
          transparent 75%
        );
      mix-blend-mode: screen;
      transition: opacity 900ms ease;
    }

    /* Короткий световой проход по центральному стыку. */
    .seam {
      left: 49.8%;
      top: -38%;
      width: 1px;
      height: 35%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(255, 199, 117, 0.65),
        rgba(255, 238, 212, 0.9),
        transparent
      );
      box-shadow: 0 0 12px rgba(255, 170, 67, 0.18);
    }

    .logo-light {
      left: 34%;
      right: 33%;
      top: 91%;
      bottom: 1%;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 202, 124, 0.18),
          transparent 70%
        );
      mix-blend-mode: screen;
    }

    /* Маски скрывают слайд только во время вступления. */
    .curtain {
      inset: 0;
      background: #050403;
    }

    .curtain-left {
      right: 50%;
    }

    .curtain-right {
      left: 50%;
    }

    /* Кликабельная область существующего email.
       Новая надпись поверх изображения не добавляется. */
    .contact {
      position: absolute;
      z-index: 5;
      left: 42%;
      top: 96.7%;
      width: 16%;
      height: 3.3%;
      border-radius: 4px;
    }

    .contact:focus-visible {
      outline: 2px solid #ffb52e;
      outline-offset: 3px;
      background: rgba(255, 181, 46, 0.1);
    }

    /* СЦЕНАРИЙ 1 — CINEMATIC REVEAL */

    body[data-scene="1"] .artwork.ready .curtain {
      animation: fade-away 1.8s ease both;
    }

    body[data-scene="1"] .artwork.ready .ambient {
      animation: warm-arrival 3.8s 0.6s ease both;
    }

    body[data-scene="1"] .artwork.ready .logo-light {
      animation: logo-arrival 2.5s 1.2s ease both;
    }

    /* СЦЕНАРИЙ 2 — TWO WORLDS */

    body[data-scene="2"] .artwork.ready .curtain-left {
      animation: fade-away 1.6s ease both;
    }

    body[data-scene="2"] .artwork.ready .curtain-right {
      animation: fade-away 2.2s 0.2s ease both;
    }

    body[data-scene="2"] .artwork.ready .seam {
      animation: seam-pass 2.8s 1s cubic-bezier(.22,.61,.36,1) both;
    }

    body[data-scene="2"] .artwork.ready .ambient {
      animation: warm-breath 10s 1.5s ease-in-out infinite;
    }

    /* СЦЕНАРИЙ 3 — IMPACT */

    body[data-scene="3"] .artwork.ready .curtain-left {
      animation: reveal-left 1.3s cubic-bezier(.76,0,.24,1) both;
    }

    body[data-scene="3"] .artwork.ready .curtain-right {
      animation: reveal-right 1.3s cubic-bezier(.76,0,.24,1) both;
    }

    body[data-scene="3"] .artwork.ready .seam {
      animation: seam-pass 1.5s 0.5s ease-out both;
    }

    body[data-scene="3"] .artwork.ready .ambient {
      animation: warm-arrival 2.5s 0.5s ease both;
    }

    body[data-scene="3"] .artwork.ready .logo-light {
      animation: logo-arrival 1.8s 0.9s ease both;
    }

    @media (hover: hover) and (pointer: fine) {
      .artwork.ready.is-hovered .pointer-light {
        opacity: 0.75;
      }

      body[data-scene="1"] .artwork.ready.is-hovered .pointer-light {
        opacity: 0.35;
      }
    }

    @keyframes fade-away {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    @keyframes warm-arrival {
      0%   { opacity: 0; }
      45%  { opacity: 0.8; }
      100% { opacity: 0; }
    }

    @keyframes logo-arrival {
      0%, 100% { opacity: 0; }
      45%      { opacity: 0.8; }
    }

    @keyframes warm-breath {
      0%, 100% { opacity: 0; }
      50%      { opacity: 0.42; }
    }

    @keyframes seam-pass {
      0% {
        transform: translateY(0);
        opacity: 0;
      }
      20% {
        opacity: 0.6;
      }
      75% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(400%);
        opacity: 0;
      }
    }

    @keyframes reveal-left {
      from {
        opacity: 1;
        transform: translateX(0);
      }
      to {
        opacity: 1;
        transform: translateX(-101%);
      }
    }

    @keyframes reveal-right {
      from {
        opacity: 1;
        transform: translateX(0);
      }
      to {
        opacity: 1;
        transform: translateX(101%);
      }
    }

    /* Останавливаем анимации в неактивной вкладке. */
    body.is-paused .effect {
      animation-play-state: paused !important;
    }

    /* Учитываем системную настройку уменьшения движения. */
    @media (prefers-reduced-motion: reduce) {
      .effect {
        display: none !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<!--
  ВЫБОР СЦЕНАРИЯ:
  1 = Cinematic Reveal
  2 = Two Worlds
  3 = Impact
-->
<body data-scene="2">

  <main class="stage">
    <figure class="artwork" id="artwork">

      <img
        class="slide"
        id="slide"
        src="./slide.jpg"
        alt="Gram to Heart™. One is waiting. One is loved. A new growth mechanism for brands. A simple way to support pets in need."
        fetchpriority="high"
        decoding="async"
      >

      <div class="effect ambient" aria-hidden="true"></div>
      <div class="effect pointer-light" aria-hidden="true"></div>
      <div class="effect seam" aria-hidden="true"></div>
      <div class="effect logo-light" aria-hidden="true"></div>

      <div
        class="effect curtain curtain-left"
        aria-hidden="true"
      ></div>

      <div
        class="effect curtain curtain-right"
        aria-hidden="true"
      ></div>

      <a
        class="contact"
        href="mailto:info@gramtoheart.com"
        aria-label="Email Gram to Heart: info@gramtoheart.com"
      ></a>

    </figure>
  </main>

  <script>
    (() => {
      "use strict";

      const artwork = document.getElementById("artwork");
      const slide = document.getElementById("slide");

      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );

      const finePointer = window.matchMedia(
        "(hover: hover) and (pointer: fine)"
      );

      let started = false;
      let frame = 0;
      let previousTime = 0;

      let currentX = 72;
      let currentY = 40;
      let targetX = 72;
      let targetY = 40;

      function reveal() {
        if (started || !slide.naturalWidth) return;
        started = true;
        artwork.classList.add("ready");
      }

      if (slide.complete) {
        reveal();
      } else {
        slide.addEventListener("load", reveal, { once: true });
      }

      function animateLight(time) {
        const elapsed = previousTime
          ? Math.min(time - previousTime, 64)
          : 16;

        previousTime = time;

        const easing = 1 - Math.exp(-elapsed / 180);

        currentX += (targetX - currentX) * easing;
        currentY += (targetY - currentY) * easing;

        artwork.style.setProperty("--px", currentX + "%");
        artwork.style.setProperty("--py", currentY + "%");

        const distance =
          Math.abs(targetX - currentX) +
          Math.abs(targetY - currentY);

        if (distance > 0.05 && !document.hidden) {
          frame = requestAnimationFrame(animateLight);
        } else {
          frame = 0;
          previousTime = 0;
        }
      }

      function requestLightFrame() {
        if (!frame) {
          frame = requestAnimationFrame(animateLight);
        }
      }

      artwork.addEventListener("pointermove", (event) => {
        if (
          reducedMotion.matches ||
          !finePointer.matches ||
          event.pointerType === "touch"
        ) {
          return;
        }

        const bounds = artwork.getBoundingClientRect();

        const x = Math.max(
          0,
          Math.min(1, (event.clientX - bounds.left) / bounds.width)
        );

        const y = Math.max(
          0,
          Math.min(1, (event.clientY - bounds.top) / bounds.height)
        );

        targetX = 48 + x * 42;
        targetY = 15 + y * 65;

        artwork.classList.add("is-hovered");
        requestLightFrame();
      }, { passive: true });

      artwork.addEventListener("pointerleave", () => {
        artwork.classList.remove("is-hovered");
        targetX = 72;
        targetY = 40;

        if (!reducedMotion.matches) {
          requestLightFrame();
        }
      });

      function stopMotion() {
        cancelAnimationFrame(frame);
        frame = 0;
        previousTime = 0;
        artwork.classList.remove("is-hovered");
      }

      document.addEventListener("visibilitychange", () => {
        document.body.classList.toggle(
          "is-paused",
          document.hidden
        );

        if (document.hidden) stopMotion();
      });

      reducedMotion.addEventListener("change", stopMotion);
    })();
  </script>
</body>
</html>
